interface:
  display_name: "HTML Output Quality"
  short_description: "Gate local HTML reports, dashboards, and result cards before handoff."
  default_prompt: "Use this skill when a task creates or reviews a local HTML artifact. Keep SKILL.md instructions in Markdown, reuse existing artifacts and checks, run check-html.mjs when its offline-report scope fits, and report real findings, screenshots, and limitations. Do not require templates or unnecessary interactivity."
