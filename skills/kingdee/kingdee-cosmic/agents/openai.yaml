interface:
  display_name: "Kingdee Cosmic"
  short_description: "苍穹 Java 二开、插件、Cache/MQ、OpenAPI 与故障诊断"
  default_prompt: |
    使用 $kingdee-cosmic 按 author、diagnose-readonly 或 execute-approved 模式处理苍穹 Java、Cache/MQ、插件或诊断任务；先确认元数据和 SDK 证据，再复用项目封装并执行 Gradle 或 post-check 验证。

policy:
  allow_implicit_invocation: true
