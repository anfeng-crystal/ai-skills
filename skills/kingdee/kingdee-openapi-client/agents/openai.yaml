interface:
  display_name: "Kingdee OpenAPI Client"
  short_description: "金蝶 OpenAPI 鉴权、接口与 MCP 工具发现、参数核验和 Java/Python 调用代码"
  default_prompt: |
    使用 $kingdee-openapi-client 从外部客户端调用金蝶苍穹/星瀚 OpenAPI：按 SKILL.md 与认证参考卡中的目标版本和认证模式取用、缓存和续取 token；优先目标 API 文档，queryOpenApi 按已验证部署使用；生成 Java/Python 调用代码。MCP 工具发现或参数不一致按需使用专项参考，区分发现 Token 与业务 Token。复用已确认的环境和凭据来源，示例中的凭据与地址使用占位符；同一业务操作重试复用 Idempotency-Key，金额用高精度类型。实际调用遵守技能的授权与副作用边界。服务端开发、安全审计或页面登录会话分别转对应技能。

policy:
  allow_implicit_invocation: true
